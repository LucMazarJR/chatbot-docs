services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # A senha vem do .env; antes era o literal "default" no compose.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}", "--appendonly", "yes"]
    volumes:
      # Sem volume, reiniciar o Redis apagava a memória de todas as conversas.
      - redis_data:/data
    # A porta não é mais publicada no host: só n8n e gateway precisam dela,
    # e ambos estão na mesma rede do compose.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petsaude}
      POSTGRES_USER: ${POSTGRES_USER:-petsaude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Fixa a codificação no initdb: a locale do container é C, e sem UTF8
      # explícito nomes com acento entram truncados já na primeira carga.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      # Sem volume, derrubar o container apaga todos os usuários do dashboard.
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Publicado no host porque o backend do dashboard roda FORA deste compose
      # (pnpm start:dev local, Render em produção) e não enxerga a rede interna.
      # Preso a 127.0.0.1 para não expor o banco na rede local.
      # Porta do HOST configuravel: instalacoes nativas do Postgres costumam
      # ocupar a 5432, e o container nao sobe se a porta estiver tomada.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petsaude} -d ${POSTGRES_DB:-petsaude}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  whatsapp-gateway:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}

      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?defina GATEWAY_API_KEY no .env}

      WA_SESSION_ID: ${WA_SESSION_ID:-default}
      WA_AUTH_DIR: /app/.sessions
      WA_AUTO_START: ${WA_AUTO_START:-true}
      WA_MARK_AS_READ: ${WA_MARK_AS_READ:-true}
      WA_SEND_MIN_DELAY_MS: ${WA_SEND_MIN_DELAY_MS:-1200}
      WA_SEND_MAX_DELAY_MS: ${WA_SEND_MAX_DELAY_MS:-3000}
      WA_MAX_MSG_PER_MINUTE: ${WA_MAX_MSG_PER_MINUTE:-20}
      WA_MAX_TYPING_MS: ${WA_MAX_TYPING_MS:-4000}

      # Nome do serviço na rede do compose — não passa pelo Cloudflare Tunnel.
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/whatsapp}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:?defina N8N_WEBHOOK_TOKEN no .env}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?defina N8N_WEBHOOK_SECRET no .env}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # db 1 isola o gateway da memória de chat do n8n (db 0).
      REDIS_DB: 1
      # Existiam no env.schema.ts mas nunca chegavam ao container: defini-las no
      # .env não tinha efeito nenhum, e valiam sempre os defaults do schema.
      N8N_WEBHOOK_TIMEOUT_MS: ${N8N_WEBHOOK_TIMEOUT_MS:-10000}
      N8N_WEBHOOK_MAX_RETRIES: ${N8N_WEBHOOK_MAX_RETRIES:-3}
      DEDUPE_TTL_SECONDS: ${DEDUPE_TTL_SECONDS:-86400}
    ports:
      # Exposto no host só para ler o QR code e o Swagger durante o setup.
      - "3000:3000"
    volumes:
      - wa_sessions:/app/.sessions
    depends_on:
      redis:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      WEBHOOK_URL: ${CLOUDFLARE_URL:-http://localhost:5678}
      N8N_HOST: 0.0.0.0
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: ${N8N_LOG_LEVEL:-info}
      N8N_SECURE_COOKIE: false
      N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE: true
      N8N_HIDE_USAGE_PAGE: true
      # Usadas pelos nós HTTP do fluxo para falar com o gateway.
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      GATEWAY_URL: ${GATEWAY_URL:-http://whatsapp-gateway:3000}
      # Sem isto o n8n recusa `{{ $env.* }}` nas expressões ("access to env vars
      # denied") e os nós HTTP saem com URL e X-Api-Key vazios — o fluxo executa
      # até o fim sem erro visível e nenhuma mensagem chega ao cidadão.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - n8n

  # --- Dashboard de gestão de FAQs -------------------------------------------
  # Vive em outro repositório (LucMazarJR/Dashboard-PetSaude), clonado dentro
  # desta pasta. Por isso os dois serviços ficam no profile `dashboard`: sem
  # ele, `docker compose up -d` continua funcionando para quem clonou só este
  # repositório e não tem a pasta.
  #
  # Para subir tudo junto, defina COMPOSE_PROFILES=dashboard no .env — aí o
  # `docker compose up -d` normal já inclui os dois.
  dashboard-api:
    profiles: ["dashboard"]
    build:
      context: ./Dashboard-PetSaude/back
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      # Rede interna do compose: `postgres` na porta 5432, não a porta publicada
      # no host. O POSTGRES_HOST_PORT só existe para acesso de fora.
      DATABASE_URL: postgresql://${POSTGRES_USER:-petsaude}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-petsaude}
      DATABASE_SSL: "false"
      # Cria as tabelas no primeiro boot, sem precisar rodar migration à mão.
      DB_RUN_MIGRATIONS: "true"
      MONGODB_URI: ${MONGODB_URI:?defina MONGODB_URI no .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?defina GEMINI_API_KEY no .env}
      # Precisa ser o MESMO modelo da base e do nó do n8n. Ver docs/handoff-notebook.md.
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_TASK_TYPE: ${GEMINI_TASK_TYPE:-SEMANTIC_SIMILARITY}
      JWT_SECRET: ${DASHBOARD_JWT_SECRET:?defina DASHBOARD_JWT_SECRET no .env}
      JWT_EXPIRES_IN_SECONDS: ${DASHBOARD_JWT_EXPIRES_IN_SECONDS:-28800}
      CORS_ORIGINS: ${DASHBOARD_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      FAQ_PURGE_ENABLED: "false"
    ports:
      - "127.0.0.1:${DASHBOARD_API_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard-front:
    profiles: ["dashboard"]
    build:
      context: ./Dashboard-PetSaude/front
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Nome do serviço na rede do compose. O front chama a API pelo SERVIDOR
      # (server functions), então o navegador nunca precisa alcançar este nome.
      API_BASE_URL: http://dashboard-api:3333
      # Criptografa o cookie que guarda o JWT. Trocar derruba todas as sessões.
      SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?defina DASHBOARD_SESSION_SECRET no .env}
    ports:
      - "127.0.0.1:${DASHBOARD_FRONT_PORT:-5173}:3000"
    depends_on:
      - dashboard-api

volumes:
  n8n_data:
  # Usuários, papéis e sessões do dashboard. As FAQs continuam no MongoDB Atlas.
  postgres_data:
  redis_data:
  # Credenciais da sessão do WhatsApp. Apagar este volume exige novo QR code.
  wa_sessions:
  # Mantido até a migração ser validada em produção — permite voltar ao WAHA
  # sem perder a sessão antiga. Pode ser removido depois.
  waha_data:
