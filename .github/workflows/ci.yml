name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` (e não `install`) para instalar exatamente o lockfile.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes e2e
        run: npm run test:e2e

  # O chat em uso. A Vercel só compila depois do push na main, e não roda os
  # testes: sem este job, um teste quebrado chegaria às pessoas sem aviso.
  pwa:
    name: PWA (typecheck, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      # A mesma versão do Dockerfile do PWA.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # Sem variável de ambiente nenhuma, de propósito: as variáveis são lidas
      # na hora do pedido, e um build que passasse a exigir uma delas quebraria
      # a imagem do Docker.
      - name: Build
        run: npm run build

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Só valida que a imagem compila; a publicação fica para o deploy.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
