# Sobreposição para a VM082 (172.21.31.182), o servidor da prefeitura dedicado
# ao chatbot. Não substitui o compose principal: o .env da VM tem
#   COMPOSE_FILE=docker-compose.yml:docker-compose.vm082.yml
# e com isso o `docker compose` comum já inclui este arquivo. Ver
# docs/servidor-vm082.md.
#
# O docker-compose.franca.yml é de outro servidor (172.21.31.167, compartilhado
# com outras aplicações) e não vale aqui.

# O Compose nomeia os volumes pelo nome do projeto, que por padrão é o nome da
# pasta. Sem isto, clonar em /srv/chatbot-petsaude criaria volumes
# chatbot-petsaude_*, e o n8n subiria vazio, sem os fluxos e as credenciais
# migrados da máquina anterior (que usava a pasta chatbot-docs).
name: chatbot-docs

services:
  n8n:
    # A versão precisa ser a mesma da máquina de onde os dados vieram: o `latest`
    # pode trazer uma versão nova, que migra o banco do n8n na primeira subida, e
    # aí não dá mais para voltar os dados para a máquina antiga.
    image: n8nio/n8n:${N8N_VERSAO:-latest}
    environment:
      # O compose principal tira este endereço do CLOUDFLARE_URL. Aqui não há
      # túnel, e um .env trazido de outra máquina faria o n8n se anunciar num
      # endereço morto: quem abre um link dele cai no erro 1033 da Cloudflare.
      WEBHOOK_URL: ${N8N_URL_PUBLICA:-http://localhost:3811}
      # O editor só é alcançado pelo túnel SSH, e o proxy publica só os
      # /webhook/. Sem isto, com o domínio definido, os links do editor (e-mail
      # de licença, retorno de OAuth) levariam a uma página que não existe.
      N8N_EDITOR_BASE_URL: http://localhost:3811
    # A entrada é o proxy do DTI (Nginx Proxy Manager, num container desta VM).
    # De dentro de um container, o 127.0.0.1 do host não é alcançável: quando o
    # proxy for ligado, N8N_HOST_IP recebe o IP da VM (172.21.31.182).
    # A VM é dividida entre os grupos do PET, e cada um tem o seu bloco de portas
    # no host. O chatbot é o G1: 3810 a 3819, e o Postgres na 5510. Dentro do
    # compose as portas não mudam.
    ports: !override
      - "${N8N_HOST_IP:-127.0.0.1}:${N8N_PORTA:-3811}:5678"

  whatsapp-gateway:
    ports: !override
      - "127.0.0.1:${GATEWAY_HOST_PORT:-3810}:3000"

  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5510}:5432"

  # Na VM não há túnel. O profile impede que um `docker compose up -d` sem nomes
  # de serviço o suba.
  cloudflared:
    profiles: ["cloudflare"]

  # Não sobe por padrão (o chat público fica na Vercel). Se subir, só para teste
  # pelo túnel SSH.
  pwa:
    ports: !override
      - "127.0.0.1:${PWA_PORT:-3812}:8080"
